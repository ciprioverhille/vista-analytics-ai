<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="Ciprio">
  <rect width="64" height="64" rx="12" fill="#0b0d0c"/>
  <!-- terrain simplifié, en gris -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".26" stroke-width="1.3">
    <rect x="5" y="13" width="54" height="38" rx="1.5"/>
    <rect x="5" y="23" width="8" height="18"/>
    <rect x="51" y="23" width="8" height="18"/>
    <line x1="32" y1="13" x2="32" y2="22.6"/>
    <line x1="32" y1="41.4" x2="32" y2="51"/>
    <circle cx="32" cy="32" r="9.4"/>
  </g>
  <!-- situations de jeu, en gris -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="1.05" stroke-linecap="round" stroke-linejoin="round">
    <!-- à gauche : passe entre le gardien et le défenseur central -->
    <circle cx="8.6" cy="32" r="1.35"/>
    <circle cx="18" cy="26.4" r="1.35"/>
    <path d="M10 31.2 L16.6 27.2" stroke-dasharray="1.2 1.3"/>
    <!-- en haut à droite : course d'appel -->
    <circle cx="42.8" cy="17.4" r="1.35"/>
    <path d="M44.6 18.2 Q47.4 20.6 50.6 19" stroke-dasharray="1.2 1.3"/>
    <path d="M49.2 17.6 L51 18.9 L49.6 20.6"/>
    <!-- à droite : passe entre le gardien et le latéral -->
    <circle cx="55.4" cy="32" r="1.35"/>
    <circle cx="46.6" cy="44.6" r="1.35"/>
    <path d="M54.6 33.2 L47.4 43.4" stroke-dasharray="1.2 1.3"/>
  </g>
  <!-- le C, tracé sur la ligne du rond central -->
  <path d="M38.65 25.35 A9.4 9.4 0 1 0 38.65 38.65" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
</svg>
