<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="Ciprio">
  <rect width="64" height="64" rx="12" fill="#0b0d0c"/>
  <!-- terrain simplifié, en gris -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.3">
    <rect x="5" y="13" width="54" height="38" rx="1.5"/>
    <rect x="5" y="23" width="8" height="18"/>
    <rect x="51" y="23" width="8" height="18"/>
    <line x1="32" y1="13" x2="32" y2="22.5"/>
    <line x1="32" y1="41.5" x2="32" y2="51"/>
    <circle cx="32" cy="32" r="9.5"/>
  </g>
  <!-- à gauche : porteur avec une bonne option (vert) et une option risquée (rouge) -->
  <g fill="none" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="1.5 1.5">
    <path d="M16.5 37.5 L19.5 22.5" stroke="#6fa587"/>
    <path d="M16.5 37.5 L9.5 46" stroke="#c27a70"/>
  </g>
  <path d="M7.6 42.6 L9.6 44.6 M9.6 42.6 L7.6 44.6" stroke="#ffffff" stroke-opacity=".3" stroke-width="1" stroke-linecap="round"/>
  <!-- à droite : circuit de passes -->
  <g fill="none" stroke-width="1.1" stroke-linecap="round">
    <path d="M44 18.5 L48.5 29" stroke="#6fa587" stroke-opacity=".9"/>
    <path d="M48.5 29 L43.5 44.5" stroke="#c27a70" stroke-dasharray="1.5 1.5"/>
  </g>
  <path d="M52.6 34.4 L54.6 36.4 M54.6 34.4 L52.6 36.4" stroke="#ffffff" stroke-opacity=".3" stroke-width="1" stroke-linecap="round"/>
  <g fill="#ffffff" fill-opacity=".55">
    <circle cx="16.5" cy="37.5" r="1.6"/>
    <circle cx="19.5" cy="22.5" r="1.4"/>
    <circle cx="44" cy="18.5" r="1.4"/>
    <circle cx="48.5" cy="29" r="1.6"/>
    <circle cx="43.5" cy="44.5" r="1.4"/>
  </g>
  <circle cx="9.5" cy="46" r="1.4" fill="#c27a70" fill-opacity=".85"/>
  <!-- le C, repassé en blanc sur le rond central -->
  <path d="M38.35 24.94 A9.5 9.5 0 1 0 38.35 39.06" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
