<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="Ciprio">
  <rect width="64" height="64" rx="12" fill="#0b0d0c"/>
  <!-- terrain simplifié, en gris -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="1.3">
    <rect x="5" y="13" width="54" height="38" rx="1.5"/>
    <rect x="5" y="23" width="8" height="18"/>
    <rect x="51" y="23" width="8" height="18"/>
    <line x1="32" y1="13" x2="32" y2="22.5"/>
    <line x1="32" y1="41.5" x2="32" y2="51"/>
    <circle cx="32" cy="32" r="9.5"/>
  </g>
  <!-- à gauche : corner, trajectoires en pointillés gris vers nos joueurs (vert), adversaires (rouge) -->
  <path d="M6.9 47.6 L9.1 49.8 M9.1 47.6 L6.9 49.8" stroke="#ffffff" stroke-opacity=".6" stroke-width="1.1" stroke-linecap="round"/>
  <g fill="none" stroke="#ffffff" stroke-opacity=".38" stroke-width="1" stroke-linecap="round" stroke-dasharray="1.3 1.5">
    <path d="M9 46.5 Q15 41 10 28.5"/>
    <path d="M9 46.5 Q13 42 17 36"/>
  </g>
  <g fill="#6fa587">
    <circle cx="10" cy="27.5" r="1.6"/>
    <circle cx="17.2" cy="35.2" r="1.6"/>
  </g>
  <g fill="#c27a70">
    <circle cx="12.6" cy="31" r="1.5"/>
    <circle cx="15" cy="39.6" r="1.5"/>
    <circle cx="8" cy="35.5" r="1.5"/>
  </g>
  <!-- à droite : circuit de passes de nos joueurs (vert), pressés par l'adversaire (rouge) -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".38" stroke-width="1" stroke-linecap="round">
    <path d="M55.5 32 L47.5 25 L43.5 17.5"/>
    <path d="M55.5 32 L47.5 39"/>
  </g>
  <g fill="#6fa587">
    <circle cx="55.5" cy="32" r="1.6"/>
    <circle cx="47.5" cy="25" r="1.6"/>
    <circle cx="47.5" cy="39" r="1.6"/>
    <circle cx="43.5" cy="17.5" r="1.6"/>
  </g>
  <g fill="#c27a70">
    <circle cx="51.5" cy="20.5" r="1.5"/>
    <circle cx="44" cy="43.5" r="1.5"/>
  </g>
  <!-- le C, repassé en blanc sur le rond central -->
  <path d="M38.35 24.94 A9.5 9.5 0 1 0 38.35 39.06" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
